[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-kit"
version = "0.1.0"
description = "A reliability test kit for tool-using LLM agents: injections, broken tools, exfiltration and excessive actions, scored by code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2", "langchain-openai>=0.2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ark = "ark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
